<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Neon Tetris</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>TETRIS</h1>
    <div class="subtitle">Neon Cyberpunk Edition</div>
  </header>

  <div class="game-container">
    
    <!-- LEFT PANEL: HOLD & STATS -->
    <div class="panel side-panel">
      <div class="preview-box">
        <h3>HOLD</h3>
        <canvas id="hold-canvas" class="preview-canvas" width="100" height="100"></canvas>
      </div>
      
      <div class="stats-box">
        <div class="stat-item">
          <span class="stat-label">Score</span>
          <span id="score-val" class="stat-value">000000</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Level</span>
          <span id="level-val" class="stat-value">1</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Lines</span>
          <span id="lines-val" class="stat-value">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">High Score</span>
          <span id="highscore-val" class="stat-value">000000</span>
        </div>
      </div>
    </div>

    <!-- MAIN BOARD PANEL -->
    <div class="main-board-wrapper">
      <canvas id="game-board" width="300" height="600"></canvas>
      
      <!-- START OVERLAY -->
      <div id="start-overlay" class="overlay">
        <h2>CYBER NEON<br>TETRIS</h2>
        <button id="start-btn" class="btn btn-cyan">PLAY GAME</button>
      </div>

      <!-- GAME OVER OVERLAY -->
      <div id="gameover-overlay" class="overlay hidden">
        <h2>GAME OVER</h2>
        <div class="stat-item" style="text-align: center;">
          <span class="stat-label">Final Score</span>
          <span id="final-score" class="stat-value" style="color: var(--neon-red); text-shadow: 0 0 10px rgba(255,0,85,0.4)">0</span>
        </div>
        <button id="restart-btn" class="btn btn-red">PLAY AGAIN</button>
      </div>
    </div>

    <!-- RIGHT PANEL: NEXT & CONTROLS -->
    <div class="panel side-panel">
      <div class="preview-box">
        <h3>NEXT</h3>
        <canvas id="next-canvas" class="preview-canvas" width="100" height="100"></canvas>
      </div>
      
      <div style="display: flex; flex-direction: column; gap: 10px; width: 100%;">
        <button id="pause-btn" class="btn btn-secondary" style="width: 100%; font-family: 'Orbitron'; font-size: 0.75rem; padding: 10px 0;">PAUSE</button>
        <button id="sound-btn" class="btn btn-secondary" style="width: 100%; font-family: 'Orbitron'; font-size: 0.75rem; padding: 10px 0;">SOUND: ON</button>
      </div>
    </div>

  </div>

  <!-- KEYBOARD CONTROLS INFO (DESKTOP) -->
  <div class="controls-info">
    <p>
      <span class="key">←</span> <span class="key">→</span> Move &nbsp;|&nbsp; 
      <span class="key">↑</span> Rotate Clockwise &nbsp;|&nbsp; 
      <span class="key">↓</span> Soft Drop &nbsp;|&nbsp; 
      <span class="key">Space</span> Hard Drop
    </p>
    <p style="margin-top: 5px;">
      <span class="key">Shift</span> or <span class="key">C</span> Hold &nbsp;|&nbsp; 
      <span class="key">P</span> or <span class="key">Esc</span> Pause
    </p>
  </div>

  <!-- MOBILE TOUCH CONTROLS -->
  <div class="mobile-controls">
    <button id="touch-left" class="touch-btn">◀</button>
    <button id="touch-rotate" class="touch-btn">▲</button>
    <button id="touch-right" class="touch-btn">▶</button>
    <button id="touch-soft" class="touch-btn">▼</button>
    <button id="touch-hard" class="touch-btn">⚡</button>
    <button id="touch-hold" class="touch-btn touch-btn-wide" style="grid-column: span 5;">HOLD</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
